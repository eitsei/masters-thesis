server:
  port: 8081

spring:
  application:
    name: rag-baseline
  ai:
    ollama:
      base-url: http://${OLLAMA_HOST:localhost:11434}
      chat:
        options:
          model: gemma4:12b
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        host: ${SPRING_AI_VECTORSTORE_QDRANT_HOST:localhost}
        port: 6334 # Spring AI defaults to gRPC port for Qdrant (6334)
        collection-name: banking-knowledge
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics

# Custom configuration for RAG properties and pricing
rag:
  collections:
    simple: banking-knowledge
    small-to-big: banking-small-to-big
  pricing:
    models:
      "gemma4:e2b":
        input-cost-per-million: 0.10
        output-cost-per-million: 0.20
        cached-input-cost-per-million: 0.05
      "gemma4:12b":
        input-cost-per-million: 0.10
        output-cost-per-million: 0.20
        cached-input-cost-per-million: 0.05


